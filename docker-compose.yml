services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-app_db} -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: always
    environment:
      REDIS_PORT: ${REDIS_PORT:-6379}
    ports:
      - ${REDIS_PORT}:6379

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: always
    ports:
      - "8333:8333"
      - "9333:9333"
    command: server -dir=/data -s3
    volumes:
      - seaweed_data:/data

  backend:
    build: ./backend
    restart: always
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost}
      DJANGO_FRONTEND_URL: ${DJANGO_FRONTEND_URL:-localhost}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REDIS_PORT: ${REDIS_PORT:-6379}
      CELERY_BROKER_URL: redis://redis:${REDIS_PORT:-6379}/0
      CELERY_RESULT_BACKEND: redis://redis:${REDIS_PORT:-6379}/0
      CELERY_ACCEPT_CONTENT: ${CELERY_ACCEPT_CONTENT:-json}
      CELERY_TASK_SERIALIZER: ${CELERY_TASK_SERIALIZER:-json}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-someemail@gmail.com}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-your_email_password}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Course Platform <someemail@gmail.com>}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      USE_SEAWEEDFS: ${USE_SEAWEEDFS:-True}
      SEAWEEDFS_ROOT_USER: ${SEAWOODFS_ROOT_USER:-admin}
      SEAWEEDFS_ROOT_PASSWORD: ${SEAWOODFS_ROOT_PASSWORD:-password}
      SEAWEEDFS_ENDPOINT: ${SEAWOODFS_ENDPOINT:-http://seaweedfs:8333}
      SEAWEEDFS_PUBLIC_ENDPOINT_URL: ${SEAWOODFS_PUBLIC_ENDPOINT_URL:-http://localhost:8333}
      SEAWEEDFS_BUCKET_NAME: ${SEAWOODFS_BUCKET_NAME:-course-videos}
      SEAWEEDFS_STORAGE_USE_SSL: ${SEAWOODFS_STORAGE_USE_SSL:-False}
    depends_on:
      - postgres
      - redis
      - seaweedfs
    ports:
      - "8000:8000"
    volumes:
      - django_static:/app/staticfiles

  celery_worker:
    build: ./backend
    command: uv run celery -A config worker -l info -P solo
    restart: always
    volumes:
      - ./backend:/app
      - /app/.venv
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
      - backend

  # stripe-cli:
  #   image: stripe/stripe-cli:latest
  #   container_name: stripe-cli
  #   command: >
  #     listen 
  #     --api-key ${STRIPE_SECRET_KEY} 
  #     --forward-to http://backend:8000/api/v1/payments/webhooks/stripe/
  #   depends_on:
  #     - backend
  #   restart: unless-stopped

  # frontend:
  #   build: ./frontend
  #   restart: always
  #   environment:
  #     NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
  #     BACKEND_URL: ${BACKEND_URL:-http://nginx}
  #   depends_on:
  #     - backend

  
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./src:/usr/share/nginx/html
      - django_static:/var/www/django/static:ro
    depends_on:
      - backend
      # - frontend


volumes:
  postgres_data:
  seaweed_data:
  django_static:
